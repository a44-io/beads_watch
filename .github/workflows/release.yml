# Cut a release: build the asset set, sign every asset with Sigstore, and open
# a DRAFT GitHub Release for a human to publish.
#
# Trigger it by pushing a version tag:
#   git tag -a v1.2.0 -m 'beads_watch v1.2.0' && git push origin v1.2.0
# or run it by hand from the Actions tab, *from that tag's ref* (the signing
# identity carries the ref; setup.sh only trusts refs/tags/v*).
#
# The build itself is scripts/publish-dist.sh --release --sign, the same
# command an operator could run locally. What the workflow adds is the
# identity: cosign signs each asset "keyless", with a short-lived certificate
# bound to this workflow file in this repository at this tag, recorded in the
# public Sigstore transparency log. That is what setup.sh checks before it
# installs anything, so a tarball swapped on the release page, even together
# with its sha256, fails verification: nothing outside this workflow can mint
# that certificate.
#
# Nothing here publishes. The release lands as a draft; publishing it is a
# button a person presses after reading what was uploaded.
name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release; run this workflow from that tag ref'
        required: true

permissions:
  contents: write # create the draft release, upload assets
  id-token: write # the OIDC token cosign turns into the signing certificate

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes list changes since the previous tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
            # A dispatch from a branch would sign under refs/heads/<branch>,
            # which setup.sh refuses by design; catch it here instead.
            [[ "$GITHUB_REF" == "refs/tags/$tag" ]] ||
              { echo "::error::run this workflow from the tag ref $tag, not $GITHUB_REF"; exit 1; }
          fi
          [[ "$(git rev-list -n1 "$tag")" == "$GITHUB_SHA" ]] ||
            { echo "::error::tag $tag does not point at the checked-out commit $GITHUB_SHA"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Build, sign, and open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/publish-dist.sh --tag "$TAG" --release --sign
